<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>湖南城乡居保 · 提档补缴测算器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #eef1f6; color: #2c3e50; padding: 12px; line-height: 1.55; font-size: 14px; }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 18px; color: #1a3c6e; text-align: center; }
  .sub { font-size: 11px; color: #8a94a6; text-align: center; margin: 4px 0 12px; }
  .card { background: #fff; border-radius: 14px; padding: 16px 14px; box-shadow: 0 2px 10px rgba(20,40,80,.10); }
  .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2px; }
  .head h2 { font-size: 16px; color: #1a3c6e; }
  .head .age { font-size: 12px; color: #8a94a6; font-weight: 400; }
  .meta { font-size: 11.5px; color: #8a94a6; margin-bottom: 12px; }
  .params { background: #f7f9fc; border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
  .params .field { font-size: 12px; color: #6b7890; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .params .flabel { font-size: 12px; color: #6b7890; }
  .params .hint { grid-column: 1 / -1; font-size: 11.5px; color: #7a879c; line-height: 1.5; }
  .params .sfx { font-size: 11px; color: #6b7890; white-space: nowrap; }
  input[type=text] { padding: 5px 6px; border: 1px solid #ccd4e0; border-radius: 8px; font-size: 14px; font-family: inherit; color: #2c3e50; background: #fff; }
  .params .stepper { display: inline-flex; align-items: center; gap: 4px; }
  .params .stepper input { width: 84px; text-align: center; }
  /* 桌面端也常显紧凑步进按钮：平时低调，悬停/聚焦时高亮 */
  .step { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 30px; width: 30px; height: 30px; padding: 0; border: 1px solid #d9e1ee; border-radius: 8px; background: #f7f9fc; color: #1a3c6e; font-family: inherit; font-size: 16px; font-weight: 700; line-height: 1; cursor: pointer; opacity: .85; transition: background .15s, border-color .15s, opacity .15s; }
  .step:hover, .step:focus-visible { opacity: 1; background: #eef4ff; border-color: #1a3c6e; }
  .step:focus-visible { outline: 2px solid #1a3c6e; outline-offset: 1px; }
  .step:active { background: #dfeaff; }
  .step:disabled { opacity: .42; color: #9aa6ba; border-color: #e2e8f1; background: #f7f9fc; cursor: not-allowed; }
  .fine { display: none; }
  input[type=checkbox] { width: 17px; height: 17px; }
  .mob-field { display: inline-flex; align-items: center; }
  .mob-trigger { display: none; }
  .sec { font-size: 13.5px; font-weight: 700; color: #1a3c6e; margin: 16px 0 7px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { background: #eef4ff; color: #1a3c6e; font-weight: 600; font-size: 12px; border-radius: 999px; padding: 2px 10px; }
  .badge b { color: #e0553a; }
  .tool { font-weight: 400; font-size: 12px; color: #8a94a6; display: inline-flex; align-items: center; gap: 5px; margin-left: auto; }
  select { padding: 5px 6px; border: 1px solid #ccd4e0; border-radius: 8px; font-size: 13px; background: #fff; }
  table.grid { width: 100%; border-collapse: collapse; font-size: 12px; }
  .grid th, .grid td { border: 1px solid #e3e8f0; padding: 5px 4px; text-align: center; }
  .grid th { background: #f0f4fa; color: #1a3c6e; font-weight: 600; }
  .grid td.y { color: #6b7890; width: 46px; }
  .grid td.diff { color: #d54b2f; font-weight: 600; }
  .scroll { max-height: 236px; overflow-y: auto; overflow-x: auto; border: 1px solid #e3e8f0; border-radius: 10px; }
  .scroll table { border: none; }
  .sumbar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 8px; }
  .sumbar .c { background: #f7f9fc; border-radius: 10px; padding: 7px 4px; text-align: center; }
  .sumbar .k { font-size: 10.5px; color: #8a94a6; }
  .sumbar .v { font-size: 15px; font-weight: 700; color: #1a3c6e; }
  .sumbar .c.hl .v { color: #e0553a; }
  .big { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  .bigbox { border-radius: 12px; padding: 12px 8px; text-align: center; }
  .b1 { background: #eef4ff; } .b2 { background: #fdeeee; }
  .bigbox .num { font-size: 27px; font-weight: 700; }
  .b1 .num { color: #1a3c6e; } .b2 .num { color: #e0553a; }
  .bigbox .cap { font-size: 11px; color: #6b7890; margin-top: 2px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .kv { background: #f7f9fc; border-radius: 10px; padding: 7px 10px; }
  .kv .k { font-size: 10.5px; color: #8a94a6; }
  .kv .v { font-size: 14.5px; font-weight: 700; color: #1a3c6e; }
  .gapnote { font-size: 12px; color: #b07818; background: #fff8e6; border-radius: 10px; padding: 8px 10px; margin: 10px 0 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cmp { margin-top: 14px; overflow-x: auto; }
  .note { font-size: 11px; color: #8a94a6; margin-top: 10px; border-top: 1px dashed #dde3ec; padding-top: 8px; }
  .foot { margin-top: 12px; background: #fffbe8; border: 1px solid #f0e2a0; border-radius: 10px; padding: 10px 12px; font-size: 11.5px; color: #7a6a20; }

  /* ---------- 小屏选择层（半屏弹出，仅由自定义触发按钮打开） ---------- */
  .sheet-mask { position: fixed; inset: 0; z-index: 40; background: rgba(12,20,35,.48); opacity: 0; pointer-events: none; transition: opacity .18s; }
  .sheet-mask.show { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; margin: 0 auto; max-width: 640px; max-height: 82vh; background: #fff; border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(10,20,40,.22); display: flex; flex-direction: column; transform: translateY(105%); transition: transform .22s ease; }
  .sheet.show { transform: translateY(0); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #e6ebf3; }
  .sheet-title { font-size: 18px; font-weight: 700; color: #1a3c6e; }
  .sheet-close { min-height: 44px; padding: 0 14px; border: 1px solid #ccd4e0; border-radius: 10px; background: #f7f9fc; font-family: inherit; font-size: 17px; font-weight: 600; color: #3d4c63; cursor: pointer; }
  .sheet-list { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 0; }
  .sheet-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 56px; padding: 8px 18px; border: 0; border-bottom: 1px solid #eef2f7; background: #fff; font-family: inherit; font-size: 19px; font-weight: 700; color: #2c3e50; text-align: left; cursor: pointer; }
  .sheet-row .ck { visibility: hidden; color: #1a3c6e; font-size: 19px; }
  .sheet-row.on { background: #eef4ff; box-shadow: inset 0 0 0 2px #1a3c6e; }
  .sheet-row.on .ck { visibility: visible; }
  .sheet-foot { display: flex; align-items: center; gap: 12px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid #e6ebf3; }
  .sheet-tip { flex: 1 1 auto; font-size: 13px; color: #8a94a6; }
  .sheet-ok { min-height: 48px; min-width: 128px; padding: 0 18px; border: 0; border-radius: 12px; background: #1a3c6e; color: #fff; font-family: inherit; font-size: 19px; font-weight: 700; cursor: pointer; }
  body.lock { overflow: hidden; }

  /* ---------- 桌面端：1280 / 1440 下不再是一条 480px 窄柱 ---------- */
  @media (min-width: 900px) {
    body { padding: 24px; }
    .wrap { max-width: 820px; }
    h1 { font-size: 22px; }
    .sub { font-size: 12px; max-width: 660px; margin: 6px auto 16px; }
    .card { padding: 22px 24px; }
    .params { grid-template-columns: 1fr 1fr 1fr; gap: 12px 20px; padding: 14px 16px; }
    .params .field { font-size: 13px; }
    .params .flabel { font-size: 13px; }
    .params .stepper { gap: 6px; }
    .params .stepper input { width: 84px; font-size: 15px; }
    .params .sfx { font-size: 12px; }
    .scroll { max-height: 320px; }
    .grid { font-size: 13px; }
    .grid th, .grid td { padding: 7px 6px; }
    .bigbox .num { font-size: 30px; }
  }

  /* ---------- 手机小屏：单列、放大加粗、原生下拉改为大号选择层 ---------- */
  @media (max-width: 768px) {
    body { font-size: 16px; padding: 10px; line-height: 1.6; }
    h1 { font-size: 22px; line-height: 1.4; }
    .sub { font-size: 13px; margin-bottom: 12px; }
    .card { padding: 18px 14px; }
    .head h2 { font-size: 19px; }
    .head .age { font-size: 14px; }
    .meta { font-size: 14px; }
    .params { grid-template-columns: 1fr; gap: 16px; padding: 14px; }
    .params .field { flex-direction: column; align-items: stretch; gap: 8px; font-size: 1.125rem; }
    .params .field.chk { flex-direction: row; align-items: center; gap: 12px; min-height: 48px; font-weight: 700; color: #3d4c63; }
    .params .flabel { font-size: 1.125rem; font-weight: 700; color: #3d4c63; }
    .params .hint { font-size: 15px; color: #5b6b84; }
    .params .sfx { font-size: 14px; font-weight: 600; color: #5b6b84; }
    .params .stepper { display: flex; flex-wrap: nowrap; gap: 8px; width: 100%; }
    .params .stepper input { flex: 1 1 auto; width: auto; min-width: 0; height: 48px; text-align: center; }
    .step { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 48px; width: 48px; height: 48px; min-height: 48px; padding: 0; border: 1px solid #c2cde0; border-radius: 10px; background: #fff; color: #1a3c6e; font-family: inherit; font-size: 22px; font-weight: 700; line-height: 1; opacity: 1; cursor: pointer; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .step:active { background: #eef4ff; }
    .step:disabled { color: #b3bccb; border-color: #e2e8f1; background: #f4f6fa; cursor: not-allowed; }
    .fine { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: 100%; }
    .fine .fine-cap { font-size: 15px; font-weight: 600; color: #6b7890; }
    .fine .step { flex: 0 0 64px; width: 64px; height: 44px; min-height: 44px; font-size: 18px; }
    input[type=text] { font-size: 1.25rem; font-weight: 600; height: 48px; padding: 6px 10px; }
    input[type=checkbox] { width: 24px; height: 24px; flex: none; }
    select { display: none; }
    .mob-field { display: inline-flex; align-items: center; }
    .mob-trigger { display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 72px; min-height: 48px; padding: 0 10px; border: 1px solid #ccd4e0; border-radius: 8px; background: #fff; font-family: inherit; font-size: 18px; font-weight: 700; color: #2c3e50; cursor: pointer; }
    .mob-trigger .ca { color: #8a94a6; font-size: 12px; }
    .sec { font-size: 1.0625rem; line-height: 1.45; margin-top: 18px; }
    .badge { font-size: 14px; padding: 3px 10px; }
    .tool { font-size: 14px; }
    .scroll { max-height: none; }
    .grid { font-size: 14px; }
    .grid th, .grid td { padding: 8px 4px; }
    .sumbar .k { font-size: 12.5px; }
    .sumbar .v { font-size: 19px; }
    .bigbox { padding: 14px 8px; }
    .bigbox .num { font-size: 30px; }
    .bigbox .cap { font-size: 13px; }
    .kv { padding: 9px 10px; }
    .kv .k { font-size: 12.5px; }
    .kv .v { font-size: 17px; }
    .gapnote { font-size: 14px; }
    .note { font-size: 13.5px; }
    .foot { font-size: 14px; }
  }

  /* ---------- 极小屏（≤480px）：进一步放大，结果块改单列 ---------- */
  @media (max-width: 480px) {
    body { padding: 8px; }
    h1 { font-size: 20px; }
    .params .flabel { font-size: 1.25rem; }
    .params .hint { font-size: 16px; }
    .params .stepper input { height: 50px; font-size: 1.3125rem; }
    .step { flex: 0 0 50px; width: 50px; height: 50px; min-height: 50px; }
    .fine .step { flex: 0 0 66px; width: 66px; height: 44px; min-height: 44px; }
    .big { grid-template-columns: 1fr; }
    .bigbox .num { font-size: 34px; }
    .bigbox .cap { font-size: 14px; }
    .grid2 { grid-template-columns: 1fr; }
    .kv .v { font-size: 17.5px; }
    .grid th, .grid td { padding: 9px 3px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>湖南城乡居民养老保险 · 提档补缴测算</h1>
  <div class="sub">待遇 = 基础养老金 + 个人账户 ÷ 139（+超15年每多缴1年加发2元）｜ 历年补缴无补贴，当年缴费才有补贴 ｜ 未计利息，实际更高</div>

  <div class="card" id="card"></div>

  <div class="foot">⚠️ 政策要点：① 提档补缴仅补本金差额，无补贴；② 待遇核定后不允许补缴，务必满60岁前办结；③ 补缴年限不计入"长缴多得"；④ 未计个人账户计息、基础养老金逐年上调（含高龄倾斜），实际结果只会更好；⑤ 各县市区补贴可能高于省标，办理前咨询当地经办机构。依据：湘政发〔2020〕19号、湘人社规〔2023〕22号、湖南省人社厅2026年6月《致广大城乡居民的一封信》。</div>
</div>

<div class="sheet-mask" id="sheetMask" aria-hidden="true"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="sheet-head">
    <div class="sheet-title" id="sheetTitle">选择</div>
    <button type="button" class="sheet-close" id="sheetClose">取消</button>
  </div>
  <div class="sheet-list" id="sheetList"></div>
  <div class="sheet-foot">
    <span class="sheet-tip">点选项后按「确定」</span>
    <button type="button" class="sheet-ok" id="sheetOk">确定</button>
  </div>
</div>

<script>
const TIERS = [300,400,500,600,700,800,900,1000,1500,2000,2500,3000,4000,5000,6000];
const SUB = t => t>=4000 ? 100 : t>=500 ? 60 : t===400 ? 40 : t===300 ? 30 : t>=100&&t<=200 ? 30 : 0;
const MONTHS = 139;
const CMP_TIERS = [500,1000,2000,3000,4000,6000];
const CUR_YEAR = 2026;

const MAX_TIER = Math.max(...TIERS);
const MAX_YEARS = 30;
const TOTAL_MAX = MAX_TIER * MAX_YEARS;
// 最低档：单一取值来源（缴费档次选项集合的运行时最小值），换口径只改这一处
function minTier(){ return Math.min(...TIERS); }
// 初始默认：已缴默认取最低档、提档后 4000 元/年、未来 6000 元/年
const DEFAULT_TO_TIER = 4000;
const DEFAULT_FUTURE = 6000;
const DEFAULT_YEARS = 15;

const STEP_CFG = {
  birth:     { min: 1940, max: 2010, step: 1 },
  years:     { min: 1, max: MAX_YEARS, step: 1 },
  bp:        { min: 0, max: 600, step: 10 },
  paidTotal: { min: 0, max: TOTAL_MAX, step: 100 }
};

const p = { birth:1968, paidYears:DEFAULT_YEARS, paidTotal:DEFAULT_YEARS*minTier(), paidTotalNote:null, claimToo:true, basePension:211, past:[], future:[], gapTier:DEFAULT_TO_TIER, dftTo:DEFAULT_TO_TIER, dftFut:DEFAULT_FUTURE };

const claimYear = () => p.birth + 60;
function futureYearList(){
  const end = p.claimToo ? claimYear() : claimYear() - 1;
  const arr = []; for (let y = 2026; y <= end; y++) arr.push(y); return arr;
}
function pastYearList(){
  const arr = []; for (let y = 2025; y > 2025 - p.paidYears; y--) arr.push(y); return arr;
}
function syncState(){
  const py = pastYearList(), fy = futureYearList();
  while (p.past.length < py.length) p.past.push({ paid:minTier(), to:p.dftTo });
  p.past.length = py.length;
  while (p.future.length < fy.length) p.future.push(p.dftFut);
  p.future.length = fy.length;
  p.gap = Math.max(0, 15 - py.length - fy.length);
}
const toVal = x => Math.max(x.to, x.paid);
const derivedPaidTotal = () => p.past.reduce((s,x)=>s+x.paid,0);
const clampInt = (v, min, max) => Math.min(max, Math.max(min, Math.round(v)));
// 已交总额：只在页面加载/刷新时按「默认年数 × 最低档」写入一次，之后仅由用户调整该输入框改变

function opts(list, cur){ return list.map(t=>`<option value="${t}" ${t===cur?'selected':''}>${t}</option>`).join(''); }

// 原生 select 保留（桌面用）；小屏用同源按钮 + 选择层
function mobSelect(k, list, cur, label, i){
  const di = (i === undefined) ? '' : ` data-i="${i}"`;
  return `<span class="mob-field"><select data-k="${k}"${di} data-label="${label}">${opts(list, cur)}</select><button type="button" class="mob-trigger"><span class="mv">${cur}</span><span class="ca">▾</span></button></span>`;
}

function paidHintText(){
  if (p.paidTotalNote) return p.paidTotalNote;
  return `可直接键入（按 50 元就近归整）；−/+ 每次 100 元；50 元细调用「−50 / +50」按钮（桌面用 Shift + ↑ / ↓）`;
}

function renderCard(){
  syncState();
  const py = pastYearList(), fy = futureYearList(), cy = claimYear();
  const pastRows = py.map((y,i)=>`
    <tr><td class="y">${y}</td>
    <td>${mobSelect('paid', TIERS, p.past[i].paid, `${y}年 已缴档次`, i)}</td>
    <td>${mobSelect('to', TIERS, toVal(p.past[i]), `${y}年 提档后档次`, i)}</td>
    <td class="diff" id="d${i}">${(toVal(p.past[i])-p.past[i].paid).toLocaleString()}</td></tr>`).join('');
  const futRows = fy.length ? fy.map((y,i)=>`
    <tr><td class="y">${y}</td>
    <td colspan="2">${mobSelect('fut', TIERS, p.future[i], `${y}年 缴费档次`, i)}</td>
    <td id="s${i}">+${SUB(p.future[i])}</td></tr>`).join('') : '<tr><td colspan="4" style="color:#8a94a6">已到龄或跨过领取年，无未来逐年缴费</td></tr>';
  const gapBox = p.gap>0 ? `<div class="gapnote">距15年还差 <b>${p.gap}</b> 年，需在申领前一次性补缴（无补贴）：
      按档 ${mobSelect('gap', TIERS, p.gapTier, '缺口补缴档次')} 补缴 ≈ <b id="gapAmt">${(p.gap*p.gapTier).toLocaleString()}</b> 元</div>` : '';

  const paidTotalView = p.paidTotal.toLocaleString();

  document.getElementById('card').innerHTML = `
    <div class="head"><h2>${p.birth}年生</h2><span class="age">现年 ${CUR_YEAR - p.birth} 岁 · 60岁在 ${cy} 年</span></div>
    <div class="meta">到龄当年${p.claimToo?'也缴费':'不再缴费'} → ${cy}年下半年起领 ｜ 已缴${py.length}年＋未来${fy.length}年${p.gap>0?('＋补缴'+p.gap+'年'):''} ＝ ${py.length+fy.length+p.gap}年</div>
    <div class="params">
      <div class="field">
        <label class="flabel" for="in-birth">出生年份</label>
        <span class="stepper">
          <button type="button" class="step" data-key="birth" data-dir="-1" aria-label="出生年份减少">−</button>
          <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-k="birth" id="in-birth" value="${p.birth}" title="可直接输入；↑ / ↓ 或鼠标滚轮微调 1">
          <button type="button" class="step" data-key="birth" data-dir="1" aria-label="出生年份增加">+</button>
          <span class="sfx">年</span>
        </span>
      </div>
      <div class="field">
        <label class="flabel" for="in-years">已缴年数</label>
        <span class="stepper">
          <button type="button" class="step" data-key="years" data-dir="-1" aria-label="已缴年数减少">−</button>
          <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-k="years" id="in-years" value="${p.paidYears}" title="可直接输入；↑ / ↓ 或鼠标滚轮微调 1">
          <button type="button" class="step" data-key="years" data-dir="1" aria-label="已缴年数增加">+</button>
          <span class="sfx">年</span>
        </span>
      </div>
      <div class="field param-total">
        <label class="flabel" for="paidTotalInput">已交总额</label>
        <span class="stepper">
          <button type="button" class="step" data-key="paidTotal" data-dir="-1" aria-label="已交总额减少100">−</button>
          <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="done" data-k="paidTotal" id="paidTotalInput" value="${paidTotalView}" aria-describedby="paidHint" title="可直接输入（按 50 元就近归整）；↑ / ↓ 或滚轮微调 100，Shift + ↑ / ↓ 微调 50">
          <button type="button" class="step" data-key="paidTotal" data-dir="1" aria-label="已交总额增加100">+</button>
          <span class="sfx">元</span>
        </span>
        <span class="fine">
          <span class="fine-cap">细调 50 元/次</span>
          <button type="button" class="step" data-key="paidTotal" data-dir="-1" data-step="50" aria-label="已交总额减少50">−50</button>
          <button type="button" class="step" data-key="paidTotal" data-dir="1" data-step="50" aria-label="已交总额增加50">+50</button>
        </span>
      </div>
      <div class="field">
        <label class="flabel" for="in-bp">基础养老金</label>
        <span class="stepper">
          <button type="button" class="step" data-key="bp" data-dir="-1" aria-label="基础养老金减少10">−</button>
          <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-k="bp" id="in-bp" value="${p.basePension}" title="可直接输入；↑ / ↓ 或鼠标滚轮微调 10">
          <button type="button" class="step" data-key="bp" data-dir="1" aria-label="基础养老金增加10">+</button>
          <span class="sfx">元/月</span>
        </span>
      </div>
      <label class="field chk"><input type="checkbox" data-k="too" ${p.claimToo?'checked':''}>到龄当年也缴费</label>
      <div class="hint" id="paidHint">${paidHintText()}</div>
    </div>

    <div class="sec">① 历年已缴与提档
      <span class="tool">批量提档至 ${mobSelect('batchTo', TIERS, p.dftTo, '批量提档至')}</span></div>
    <div class="scroll"><table class="grid"><tr><th>年份</th><th>已缴档次</th><th>提档后</th><th>补差</th></tr>${pastRows}</table></div>
    <div class="sumbar">
      <div class="c"><div class="k">已交总额(元)</div><div class="v" id="sumPaid">--</div></div>
      <div class="c"><div class="k">提档后总额(元)</div><div class="v" id="sumTo">--</div></div>
      <div class="c hl"><div class="k">补差总额(元)</div><div class="v" id="sumDiff">--</div></div>
    </div>

    <div class="sec">② 未来逐年缴费（当年缴享补贴）
      <span class="tool">全部按 ${mobSelect('batchFut', TIERS, p.dftFut, '未来全部按')}</span></div>
    <table class="grid"><tr><th>年份</th><th colspan="2">缴费档次</th><th>政府补贴</th></tr>${futRows}</table>
    ${gapBox}

    <div class="sec">③ 测算结果</div>
    <div class="big">
      <div class="bigbox b1"><div class="num" id="pen">--</div><div class="cap">预计月养老金（元）</div></div>
      <div class="bigbox b2"><div class="num" id="now">--</div><div class="cap">当下需补缴提差（元）</div></div>
    </div>
    <div class="grid2">
      <div class="kv"><div class="k">未来逐年缴费还需缴</div><div class="v" id="fut">--</div></div>
      <div class="kv"><div class="k">缺口补缴还需缴</div><div class="v" id="gpay">--</div></div>
      <div class="kv"><div class="k">比"维持一档"每月多领</div><div class="v" id="ext">--</div></div>
      <div class="kv"><div class="k">累计多掏（相对维持一档）</div><div class="v" id="cost">--</div></div>
      <div class="kv"><div class="k">回本所需</div><div class="v" id="pay">--</div></div>
      <div class="kv"><div class="k">回本时年龄</div><div class="v" id="age">--</div></div>
      <div class="kv"><div class="k">静态年化回报率</div><div class="v" id="rate">--</div></div>
      <div class="kv"><div class="k">领到80岁累计多领</div><div class="v" id="e80">--</div></div>
    </div>
    <table class="grid" id="tbl" style="margin-top:10px"></table>

    <div class="cmp"><div class="sec">④ 方案对比：历年全部提档至该档＋未来按该档缴（${p.gap>0?'含缺口补缴':'无缺口'}）</div>
    <table class="grid" id="cmp"></table></div>
    <div class="note">回本口径：多掏总额 ÷ 每月多领；"维持一档"= 历年不动＋未来按300元缴＋缺口按300元补。个人账户余额身故后可继承，本金无亏损风险。</div>`;
}

function calc(){
  syncState();
  const derivedPaid = derivedPaidTotal();
  const paidTotal = p.paidTotal;
  const toTotal = p.past.reduce((s,x)=>s+toVal(x),0);
  const now = toTotal - derivedPaid;
  const sumTo = paidTotal + now;

  document.getElementById('sumPaid').textContent = paidTotal.toLocaleString();
  document.getElementById('sumTo').textContent = sumTo.toLocaleString();
  document.getElementById('sumDiff').textContent = now.toLocaleString();

  const paidInput = document.getElementById('paidTotalInput');
  if (paidInput){
    // 聚焦中保持无千分位的原始数字，避免步进后显示旧值；失焦恢复格式化
    paidInput.value = document.activeElement === paidInput ? String(paidTotal) : paidTotal.toLocaleString();
  }
  const bpInput = document.getElementById('in-bp');
  if (bpInput) bpInput.value = p.basePension;
  const paidHint = document.getElementById('paidHint');
  if (paidHint) paidHint.textContent = paidHintText();

  const futPay = p.future.reduce((s,t)=>s+t, 0) + p.gap*p.gapTier;
  const account = paidTotal + now
                + p.future.reduce((s,t)=>s+t+SUB(t),0) + p.gap*p.gapTier;
  const bonus = 2 * Math.max(0, p.past.length + p.future.length - 15);
  const pension = p.basePension + account/MONTHS + bonus;

  const bAccount = paidTotal + p.future.length*330 + p.gap*300;
  const bPension = p.basePension + bAccount/MONTHS + bonus;
  const ext = pension - bPension;
  const cost = now + p.future.reduce((s,t)=>s+t-300,0) + p.gap*(p.gapTier-300);
  const payM = ext>0 ? cost/ext : 0;
  const rate = cost>0 ? ext*12/cost : 0;

  document.getElementById('pen').textContent = pension.toFixed(0);
  document.getElementById('now').textContent = now.toLocaleString();
  document.getElementById('fut').textContent = futPay ? futPay.toLocaleString()+' 元' : '—';
  document.getElementById('gpay').textContent = p.gap ? (p.gap*p.gapTier).toLocaleString()+' 元' : '—';
  document.getElementById('ext').textContent = (ext>0.5? '+' : '') + ext.toFixed(0) + ' 元';
  document.getElementById('cost').textContent = cost ? cost.toLocaleString()+' 元' : '—';
  document.getElementById('pay').textContent = payM ? payM.toFixed(0)+' 个月（约'+(payM/12).toFixed(1)+'年）' : '—';
  document.getElementById('age').textContent = payM ? (60+payM/12).toFixed(1)+' 岁' : '—';
  document.getElementById('rate').textContent = rate ? (rate*100).toFixed(1)+' %' : '—';
  document.getElementById('e80').textContent = ext>0 ? (ext*240/10000).toFixed(1)+' 万元' : '—';

  document.getElementById('tbl').innerHTML = `<tr><th>领取至</th><th>累计多领</th><th>扣多缴后净收益</th></tr>` +
    [[65,5],[70,10],[75,15],[80,20],[85,25]].map(([a,y])=>{
      const c = ext*12*y, n = c-cost;
      return `<tr><td>${a}岁</td><td>${(c/10000).toFixed(2)} 万</td><td style="color:${n>=0?'#d54b2f':'#3d8b5f'}">${n>=0?'+':''}${(n/10000).toFixed(2)} 万</td></tr>`;
    }).join('');

  document.getElementById('cmp').innerHTML = `<tr><th>提档至</th><th>补缴</th><th>未来共缴</th><th>月养老金</th><th>多领</th><th>回本</th></tr>` +
    CMP_TIERS.map(t=>{
      const now2 = p.past.reduce((s,x)=>s+Math.max(t-x.paid,0),0);
      const fut2 = p.future.length*t + p.gap*t;
      const acc2 = paidTotal + now2 + p.future.length*(t+SUB(t)) + p.gap*t;
      const pen2 = p.basePension + acc2/MONTHS + bonus;
      const e2 = pen2 - bPension, c2 = now2 + p.future.length*(t-300) + p.gap*(t-300);
      const a2 = e2>0 ? (60 + (c2/e2)/12).toFixed(1)+'岁' : '—';
      return `<tr><td><b>${t}</b></td><td class="diff">${now2.toLocaleString()}</td><td>${fut2.toLocaleString()}</td><td>${pen2.toFixed(0)}</td><td>+${e2.toFixed(0)}</td><td>${a2}</td></tr>`;
    }).join('');

  syncTriggers();
  syncStepButtons();
}

// 行内局部更新（不整卡重渲染，保留滚动位置）
function refreshRow(i){
  const d = document.getElementById('d'+i);
  if (d) d.textContent = (toVal(p.past[i])-p.past[i].paid).toLocaleString();
  const toSel = document.querySelector(`select[data-k="to"][data-i="${i}"]`);
  if (toSel) toSel.innerHTML = opts(TIERS, toVal(p.past[i]));
}

// 小屏按钮与原生 select 共用同一状态
function syncTriggers(){
  document.querySelectorAll('.mob-field').forEach(w=>{
    const sel = w.querySelector('select');
    const mv = w.querySelector('.mv');
    if (sel && mv && sel.selectedIndex >= 0) mv.textContent = sel.options[sel.selectedIndex].textContent;
  });
}

function currentValueOf(key){
  if (key === 'birth') return p.birth;
  if (key === 'years') return p.paidYears;
  if (key === 'bp') return p.basePension;
  if (key === 'paidTotal') return p.paidTotal;
  return 0;
}

function syncStepButtons(){
  document.querySelectorAll('button.step').forEach(btn=>{
    const cfg = STEP_CFG[btn.dataset.key];
    if (!cfg) return;
    const cur = currentValueOf(btn.dataset.key);
    btn.disabled = (+btn.dataset.dir) < 0 ? cur <= cfg.min : cur >= cfg.max;
  });
}

function bump(key, dir, stepOverride){
  const cfg = STEP_CFG[key];
  if (!cfg) return;
  const s = stepOverride > 0 ? stepOverride : cfg.step;
  if (key === 'paidTotal'){
    // 常规 100 元、细调 50 元；统一按 50 就近归整后夹取
    p.paidTotal = clampInt(Math.round((p.paidTotal + dir*s) / 50) * 50, cfg.min, cfg.max);
    p.paidTotalNote = null;
  } else if (key === 'birth'){
    p.birth = clampInt(p.birth + dir*s, cfg.min, cfg.max);
  } else if (key === 'years'){
    p.paidYears = clampInt(p.paidYears + dir*s, cfg.min, cfg.max);
  } else if (key === 'bp'){
    p.basePension = clampInt(p.basePension + dir*s, cfg.min, cfg.max);
  }
  if (key === 'birth' || key === 'years') renderCard();
  calc();
}

document.addEventListener('change', e=>{
  const el = e.target, k = el.dataset ? el.dataset.k : null;
  if (!k) return;
  const i = +el.dataset.i;
  if (k === 'birth'){
    const d = String(el.value).replace(/[^\d]/g, '');
    if (d === ''){ el.value = p.birth; return; } // 空/非法：静默保留上一次有效值
    p.birth = clampInt(+d, STEP_CFG.birth.min, STEP_CFG.birth.max);
    renderCard(); calc(); return;
  }
  if (k === 'years'){
    const d = String(el.value).replace(/[^\d]/g, '');
    if (d === ''){ el.value = p.paidYears; return; }
    p.paidYears = clampInt(+d, STEP_CFG.years.min, STEP_CFG.years.max);
    renderCard(); calc(); return;
  }
  if (k === 'paidTotal'){
    const d = String(el.value).replace(/[^\d]/g, '');
    if (d === ''){ el.value = p.paidTotal.toLocaleString(); return; }
    const raw = +d;
    const rounded = clampInt(Math.round(raw / 50) * 50, STEP_CFG.paidTotal.min, STEP_CFG.paidTotal.max);
    p.paidTotal = rounded;
    p.paidTotalNote = rounded !== raw ? `输入 ${raw.toLocaleString()} 元，已按 50 元就近归整为 ${rounded.toLocaleString()} 元` : null;
    calc(); return;
  }
  if (k === 'bp'){
    const d = String(el.value).replace(/[^\d]/g, '');
    if (d === ''){ el.value = p.basePension; return; }
    p.basePension = clampInt(+d, STEP_CFG.bp.min, STEP_CFG.bp.max);
    el.value = p.basePension;
    calc(); return;
  }
  if (k === 'too'){ p.claimToo = el.checked; renderCard(); calc(); return; }
  if (k === 'paid'){ p.past[i].paid = +el.value; refreshRow(i); calc(); return; }
  if (k === 'to'){ p.past[i].to = +el.value; refreshRow(i); calc(); return; }
  if (k === 'fut'){ p.future[i] = +el.value; const s = document.getElementById('s'+i); if (s) s.textContent = '+'+SUB(+el.value); calc(); return; }
  if (k === 'gap'){ p.gapTier = +el.value; document.getElementById('gapAmt').textContent = (p.gap*p.gapTier).toLocaleString(); calc(); return; }
  if (k === 'batchTo'){ p.dftTo = +el.value; p.past.forEach(x=>x.to=p.dftTo); renderCard(); calc(); return; }
  if (k === 'batchFut'){ p.dftFut = +el.value; p.future.forEach((_,j)=>p.future[j]=p.dftFut); renderCard(); calc(); return; }
});

// 即时清理非法字符（数字键盘仍由 inputmode=numeric 保证）
document.addEventListener('input', e=>{
  const el = e.target, k = el.dataset ? el.dataset.k : null;
  if (!k || !STEP_CFG[k]) return;
  const cleaned = String(el.value).replace(/[^\d]/g, '');
  if (cleaned !== el.value) el.value = cleaned;
});

// 聚焦时去掉千分位，便于直接键入；失焦后恢复千分位
document.addEventListener('focusin', e=>{
  const k = e.target.dataset ? e.target.dataset.k : null;
  if (!k || !STEP_CFG[k]) return;
  if (k === 'paidTotal') e.target.value = String(p.paidTotal);
  e.target.select();
});
document.addEventListener('focusout', e=>{
  const k = e.target.dataset ? e.target.dataset.k : null;
  if (k === 'paidTotal') e.target.value = p.paidTotal.toLocaleString();
});

// 桌面：无原生 spinner，改用 ↑ / ↓ 步进（Shift + ↑/↓ 对已交总额走 50 元细调）；小屏用可见按钮
document.addEventListener('keydown', e=>{
  if (e.key === 'Escape' && document.getElementById('sheet').classList.contains('show')){ closeSheet(); return; }
  const k = e.target.dataset ? e.target.dataset.k : null;
  if (!k || !STEP_CFG[k]) return;
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault();
  bump(k, e.key === 'ArrowUp' ? 1 : -1, (e.shiftKey && k === 'paidTotal') ? 50 : 0);
  // 出生年份/年数会整卡重渲染，重新聚焦以支持连续按键
  if (k === 'birth' || k === 'years'){
    const next = document.querySelector(`input[data-k="${k}"]`);
    if (next) next.focus();
  }
});

// 鼠标滚轮在输入框上微调数值，并阻止页面跟着滚动
document.addEventListener('wheel', e=>{
  const el = e.target.closest ? e.target.closest('input[data-k]') : null;
  if (!el || !STEP_CFG[el.dataset.k] || e.ctrlKey) return;
  e.preventDefault();
  const k = el.dataset.k;
  bump(k, e.deltaY < 0 ? 1 : -1, (e.shiftKey && k === 'paidTotal') ? 50 : 0);
}, { passive: false });

// 小屏 − / + 按钮：点一次走一步，长按连续调整；到边界自动停止
let repeatTimer = null, repeatInterval = null, repeatKey = '', repeatDir = 0, repeatStep = 0;
function stopRepeat(){
  if (repeatTimer){ clearTimeout(repeatTimer); repeatTimer = null; }
  if (repeatInterval){ clearInterval(repeatInterval); repeatInterval = null; }
}
document.addEventListener('pointerdown', e=>{
  const btn = e.target.closest ? e.target.closest('button.step') : null;
  if (!btn || btn.disabled) return;
  e.preventDefault();
  repeatKey = btn.dataset.key; repeatDir = +btn.dataset.dir; repeatStep = +btn.dataset.step || 0;
  bump(repeatKey, repeatDir, repeatStep);
  stopRepeat();
  repeatTimer = setTimeout(()=>{
    repeatInterval = setInterval(()=>{
      const cfg = STEP_CFG[repeatKey];
      const before = currentValueOf(repeatKey);
      bump(repeatKey, repeatDir, repeatStep);
      const after = currentValueOf(repeatKey);
      if (!cfg || after === before || after <= cfg.min || after >= cfg.max) stopRepeat();
    }, 90);
  }, 450);
});
['pointerup','pointercancel','blur'].forEach(ev=>document.addEventListener(ev, stopRepeat, true));
document.addEventListener('pointerleave', stopRepeat, true);
document.addEventListener('click', e=>{
  const btn = e.target.closest ? e.target.closest('button.step') : null;
  if (btn && !btn.disabled && e.detail === 0) bump(btn.dataset.key, +btn.dataset.dir, +btn.dataset.step || 0);
});
document.addEventListener('contextmenu', e=>{
  if (e.target.closest && e.target.closest('button.step')) e.preventDefault();
});

// ---------- 小屏选择层：一行一个选项，当前项高亮并滚到可视区 ----------
const sheetEl = document.getElementById('sheet');
const sheetMask = document.getElementById('sheetMask');
const sheetList = document.getElementById('sheetList');
const sheetTitle = document.getElementById('sheetTitle');
let sheetTarget = null, sheetPending = null;

function openSheet(sel){
  sheetTarget = sel;
  sheetPending = sel.value;
  sheetTitle.textContent = sel.dataset.label || '选择';
  sheetList.innerHTML = Array.from(sel.options).map(o=>{
    const on = o.value === sheetPending;
    return `<button type="button" class="sheet-row${on?' on':''}" data-val="${o.value}"><span>${o.textContent}</span><span class="ck">✓</span></button>`;
  }).join('');
  sheetEl.classList.add('show');
  sheetMask.classList.add('show');
  sheetEl.setAttribute('aria-hidden', 'false');
  sheetMask.setAttribute('aria-hidden', 'false');
  document.body.classList.add('lock');
  requestAnimationFrame(()=>{
    const rows = sheetList.querySelectorAll('.sheet-row');
    const idx = Array.from(rows).findIndex(r=>r.classList.contains('on'));
    if (idx >= 0 && rows[0]) sheetList.scrollTop = Math.max(0, idx * rows[0].offsetHeight - sheetList.clientHeight / 2 + rows[0].offsetHeight / 2);
  });
}
function closeSheet(){
  sheetEl.classList.remove('show');
  sheetMask.classList.remove('show');
  sheetEl.setAttribute('aria-hidden', 'true');
  sheetMask.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('lock');
  sheetTarget = null;
  sheetPending = null;
}
function commitSheet(){
  const sel = sheetTarget, val = sheetPending;
  closeSheet();
  if (sel && val !== null && sel.value !== val){
    sel.value = val;
    sel.dispatchEvent(new Event('change', { bubbles: true }));
  }
}
document.addEventListener('click', e=>{
  const t = e.target;
  if (t.closest && t.closest('.mob-trigger')){
    const field = t.closest('.mob-field');
    const sel = field && field.querySelector('select');
    if (sel) openSheet(sel);
    return;
  }
  if (t.closest && t.closest('.sheet-row')){
    const row = t.closest('.sheet-row');
    sheetList.querySelectorAll('.sheet-row.on').forEach(r=>r.classList.remove('on'));
    row.classList.add('on');
    sheetPending = row.dataset.val;
    return;
  }
  if (t.id === 'sheetOk'){ commitSheet(); return; }
  if (t.id === 'sheetClose' || t.id === 'sheetMask'){ closeSheet(); return; }
});

renderCard();
calc();
</script>
